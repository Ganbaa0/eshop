{% extends 'layout.html' %}

{% block content %}

<!-- HERO -->
<header class="hero">
    <div class="container text-center">
        <h1>Бүртгүүлэх</h1>
        <p>Манай платформд нэгдээрэй</p>
    </div>
</header>

<!-- FORM -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow-lg border-0 rounded-4 p-4">

                    <h3 class="text-center fw-bold mb-4">
                        Шинэ аккаунт үүсгэх
                    </h3>

                    <form action="{% url 'register' %}" method="POST">
                        {% csrf_token %}

                        <div class="auth-form">
                            {{ form.as_p }}
                        </div>

                        <button type="submit"
                                class="btn btn-dark w-100 rounded-pill py-2 mt-3">
                            Бүртгүүлэх
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">
                            Бүртгэлтэй юу?
                            <a href="{% url 'login' %}">Нэвтрэх</a>
                        </small>
                    </div>

                </div>

            </div>

        </div>
    </div>
</section>

{% endblock %}
